<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./page.css?v=20260828-shared-org-v3" />
<title>厂端看板 · AI质检平台</title>
    <link rel="icon" href="../assets/ds-logo.png" />
    </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img src="../assets/ds-logo.png" alt="DS logo" />
          </div>
          <div class="brand-copy">
            <strong>AI质检平台</strong>
          </div>
        </div>

        <div class="nav-scroll" data-unified-navigation aria-label="主导航"></div>

        <div class="sidebar-user" hidden>
          <div class="avatar"></div>
          <div>
            <strong id="sidebarUserName"></strong>
            <span id="sidebarUserMeta"></span>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="topbar" id="mainTopbar">
          <div>
            <div class="eyebrow" id="pageEyebrow"></div>
            <h1 class="page-title" id="pageTitle"></h1>
            <p class="page-desc" id="pageDesc"></p>
          </div>

          <div class="toolbar">
            <div class="toolbar-row" id="toolbarActions"></div>
            <div class="toolbar-row" id="toolbarFilters"></div>
          </div>
        </div>

        <div class="page-host" id="pageHost"></div>
      </main>
    </div>
    <template id="tpl-factory-dashboard">
          <div class="page-stack factory-dashboard-page" id="factoryDashboardPage" data-initial-tab="sop-execution">
            <div id="factoryDashboardMount"></div>
          </div>
        </template>

    <script src="../unified-navigation-shell.js?v=20260826-dock-inline-icon-v4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="./page.js?v=20260828-shared-org-v3"></script>
  </body>
</html>
