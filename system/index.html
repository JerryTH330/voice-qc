<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./page.css?v=20260824-dock-merge-v1" />
<title>系统管理 · AI质检平台</title>
    <link rel="icon" href="../assets/ds-logo.png" />
    </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img src="../assets/ds-logo.png" alt="DS logo" />
          </div>
          <div class="brand-copy">
            <strong>AI质检平台</strong>
          </div>
        </div>

        <div class="nav-scroll" data-unified-navigation aria-label="主导航"></div>

        <div class="sidebar-user" hidden>
          <div class="avatar"></div>
          <div>
            <strong id="sidebarUserName"></strong>
            <span id="sidebarUserMeta"></span>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="topbar" id="mainTopbar">
          <div>
            <div class="eyebrow" id="pageEyebrow"></div>
            <h1 class="page-title" id="pageTitle"></h1>
            <p class="page-desc" id="pageDesc"></p>
          </div>

          <div class="toolbar">
            <div class="toolbar-row" id="toolbarActions"></div>
            <div class="toolbar-row" id="toolbarFilters"></div>
          </div>
        </div>

        <div class="page-host" id="pageHost"></div>
      </main>
    </div>
    <template id="tpl-system">
          <div class="page-stack">
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-label">ASR 成功率</div>
                <div class="stat-value">97.8%</div>
                <div class="stat-foot"><span>过去 24 小时</span><span class="up">稳定</span></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">平均分析时延</div>
                <div class="stat-value">4.2m</div>
                <div class="stat-foot"><span>目标 ≤ 5 分钟</span><span class="up">达标</span></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">今日预警消息</div>
                <div class="stat-value">128</div>
                <div class="stat-foot"><span>站内 / 短信 / 企微</span><span class="down">+9%</span></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">SLA</div>
                <div class="stat-value">99.94%</div>
                <div class="stat-foot"><span>生产环境</span><span class="up">正常</span></div>
              </div>
            </div>
    
            <div class="system-layout">
              <div class="stack-16">
                <section class="card">
                  <div class="panel-header">
                    <div class="panel-title">
                      <h3>组织与权限</h3>
                      <p>组织角色使用标准表格排版，视觉更整齐。</p>
                    </div>
                  </div>
                  <div class="table-list">
                    <div class="table-list-row head" style="grid-template-columns:1.3fr .7fr .8fr"><div>角色</div><div>人数</div><div>权限级别</div></div>
                    <div class="table-list-row" style="grid-template-columns:1.3fr .7fr .8fr"><div>总部运营</div><div>18</div><div>全局</div></div>
                    <div class="table-list-row" style="grid-template-columns:1.3fr .7fr .8fr"><div>大区经理</div><div>46</div><div>区域</div></div>
                    <div class="table-list-row" style="grid-template-columns:1.3fr .7fr .8fr"><div>门店主管</div><div>312</div><div>门店</div></div>
                  </div>
                </section>
    
                <section class="card">
                  <div class="panel-header">
                    <div class="panel-title">
                      <h3>操作审计日志</h3>
                      <p>人工改分、规则发布和权限变更统一留痕。</p>
                    </div>
                  </div>
                  <div class="table-list">
                    <div class="table-list-row head" style="grid-template-columns:1fr .9fr 1.1fr .7fr"><div>时间</div><div>操作人</div><div>动作</div><div>结果</div></div>
                    <div class="table-list-row" style="grid-template-columns:1fr .9fr 1.1fr .7fr"><div>03/13 08:48</div><div>林岚</div><div>发布规则 v3.4</div><div><span class="status green">成功</span></div></div>
                    <div class="table-list-row" style="grid-template-columns:1fr .9fr 1.1fr .7fr"><div>03/13 08:12</div><div>陈星</div><div>人工复检返分</div><div><span class="status blue">留痕</span></div></div>
                    <div class="table-list-row" style="grid-template-columns:1fr .9fr 1.1fr .7fr"><div>03/13 07:55</div><div>平台管理员</div><div>调整角色权限</div><div><span class="status green">生效</span></div></div>
                  </div>
                </section>
              </div>
    
              <div class="stack-16">
                <section class="card">
                  <div class="panel-header">
                    <div class="panel-title">
                      <h3>数据接入状态</h3>
                      <p>右侧统一呈现外部系统和任务运行状态。</p>
                    </div>
                  </div>
                  <div class="list">
                    <div class="item">
                      <h4>云外呼</h4>
                      <p>最近同步 3 分钟前，录音流接入稳定。</p>
                      <div class="item-foot"><span class="status green">正常</span></div>
                    </div>
                    <div class="item">
                      <h4>数字工牌</h4>
                      <p>有 2 个门店上传延迟，需要巡检设备网络。</p>
                      <div class="item-foot"><span class="status amber">轻微异常</span></div>
                    </div>
                    <div class="item">
                      <h4>CRM 线索中心</h4>
                      <p>Lead ID 绑定正常，客户信息同步无阻塞。</p>
                      <div class="item-foot"><span class="status green">稳定</span></div>
                    </div>
                  </div>
                </section>
    
                <section class="card">
                  <div class="panel-header">
                    <div class="panel-title">
                      <h3>安全与合规</h3>
                      <p>把安全策略做成四张标准小卡片，更利于扫描。</p>
                    </div>
                  </div>
                  <div class="tag-grid" style="margin-top:0">
                    <div class="tag blue">PII 脱敏传输</div>
                    <div class="tag violet">权限分级隔离</div>
                    <div class="tag green">原句可追溯</div>
                    <div class="tag amber">人工改分留痕</div>
                  </div>
                </section>
    
                <section class="card">
                  <div class="panel-header">
                    <div class="panel-title">
                      <h3>模型任务运行</h3>
                      <p>统一收拢模型运行监控，保持结构整洁。</p>
                    </div>
                  </div>
                  <div class="list">
                    <div class="item">
                      <h4>ASR 转写任务</h4>
                      <p>待处理 43 条，平均队列 2.1 分钟。</p>
                      <div class="item-foot"><span class="status green">正常</span></div>
                    </div>
                    <div class="item">
                      <h4>Agent 质检任务</h4>
                      <p>高峰延迟 5.8 分钟，需要观察是否扩容。</p>
                      <div class="item-foot"><span class="status amber">关注</span></div>
                    </div>
                    <div class="item">
                      <h4>AI 总结任务</h4>
                      <p>成功率 96.4%，异常集中在长录音会话。</p>
                      <div class="item-foot"><span class="status blue">分析中</span></div>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>
        </template>

    <script src="../unified-navigation-shell.js?v=20260826-dock-inline-icon-v4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="./page.js?v=20260813-back-to-top-v1"></script>
  </body>
</html>
